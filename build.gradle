plugins { id 'java' }

group = 'com.onyxshop'
version = '1.0.0'

// Fully hermetic: every compile dependency is vendored under libs/cp (Maven artifacts, incl. paper-api)
// and libs/api (APIs of soft-depend plugins). No remote repositories are consulted.
dependencies {
    compileOnly fileTree(dir: 'libs/cp', include: ['*.jar'])
    compileOnly fileTree(dir: 'libs/api', include: ['*.jar'])

    // Vendored JUnit (offline build: no repositories). junit-4.x is deliberately excluded.
    testImplementation fileTree(dir: 'libs/cp', include: [
            'junit-jupiter*.jar', 'junit-platform-commons*.jar', 'junit-platform-engine*.jar', 'opentest4j-*.jar'
    ])
    testRuntimeOnly fileTree(dir: 'libs/cp', include: ['junit-platform-launcher*.jar'])
}

// Sources target class-file major 52 (Java 8) while referencing newer libraries (Paper/Geyser
// records, NMS jars), so javac runs with -source/-target 8 and without --release. Mirror that
// exactly; --release 8 would reject java.lang.Record supertypes.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Minecraft version whose NMS/craftbukkit package each version module was compiled against
def versionModules = [
        v1_16_R3: '1.16.5',
        v1_17_R1: '1.17.1',
        v1_18_R1: '1.18.1',
        v1_18_R2: '1.18.2',
        v1_19_R1: '1.19.2',
        v1_19_R2: '1.19.3',
        v1_19_R3: '1.19.4',
        v1_20_R1: '1.20.1',
        v1_20_R2: '1.20.2',
        v1_20_R3: '1.20.4',
        v1_20_R4: '1.20.6',
        v1_21_R1: '1.21.1',
        v1_21_R2: '1.21.3',
        v1_21_R3: '1.21.4',
        v1_21_R4: '1.21.5',
        v1_21_R5: '1.21.8',
        v1_21_R6: '1.21.10',
        v1_21_R7: '1.21.11',
        v26_1   : '26.1.2',
        v26_2   : '26.2',
        v26_3   : '26.3',
]

def paperModules = [
        paper_v1_21_R6: '1.21.10',
        paper_v1_21_R7: '1.21.11',
]

sourceSets {
    // Compile-only stubs for third-party plugin APIs that are not published on any public Maven repo.
    apistubs {
        java { srcDirs = ['src/apistubs/java'] }
    }

    test {
        java { srcDirs = ['src/test/java'] }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.compileClasspath
    }

    main {
        java {
            srcDirs = ['src/main/java']
            // Terracotta JobStore needs the commercial Terracotta toolkit (not distributed);
            // paper_* modules need Paper's Mojang-mapped server jar (generated by paperweight).
            exclude 'org/terracotta/**'
            exclude 'org/quartz/core/QuartzScheduler_Stub.java'
            exclude 'com/onyxshop/versions/**'
        }
        compileClasspath += sourceSets.apistubs.output
    }
}

configurations.apistubsImplementation.extendsFrom configurations.compileOnly

def vendoredModules = []

versionModules.each { name, mc ->
    if (name in vendoredModules) return
    def ss = sourceSets.create("v_${name}") {
        java.srcDirs = ["src/versions/${name}/java"]
        compileClasspath = sourceSets.main.output +
                configurations.compileClasspath +
                files("libs/nms/spigot-${mc}.jar")
    }
}

paperModules.each { name, mc ->
    if (name in vendoredModules) return
    sourceSets.create("v_${name}") {
        java.srcDirs = ["src/versions/${name}/java"]
        compileClasspath = sourceSets.main.output +
                configurations.compileClasspath +
                files("libs/nms/paper-dev-${mc}.jar")
    }
}

def versionCompileTasks = versionModules.keySet().findAll { !(it in vendoredModules) }.collect { "compileV_${it}Java" }
versionCompileTasks.addAll(paperModules.keySet().findAll { !(it in vendoredModules) }.collect { "compileV_${it}Java" })

tasks.register('compileVersions') {
    dependsOn versionCompileTasks
}

jar {
    // Critical at runtime: Paper's reflection rewriter maps NMS names according to this attribute.
    // Ship `paperweight-mappings-namespace: spigot`; without it
    // Class.forName("net.minecraft...") fails with NoClassDefFoundError on Paper.
    manifest {
        attributes('paperweight-mappings-namespace': 'spigot')
    }
    dependsOn versionCompileTasks
    (versionModules.keySet() + paperModules.keySet()).findAll { !(it in vendoredModules) }.each { n ->
        from(sourceSets["v_${n}"].output) {
            into ''
        }
    }
    // Quartz is compiled against quartz-2.3.2.jar (Exceptions attributes intact) but shipped with
    // the verbatim vendored classes (no server provides org.quartz).
    from(zipTree('libs/vendored/quartz.jar'))
    from(zipTree('libs/cp/HikariCP-4.0.3.jar')) {
        exclude 'META-INF/**'
        exclude 'module-info.class'
    }
    // SQLite is the default storage backend and TransactionLog always opens SQLite, so the driver
    // must ship inside the jar (it is compileOnly on the classpath and not resolved at runtime).
    from(zipTree('libs/cp/sqlite-jdbc-3.54.1.0.jar')) {
        exclude 'META-INF/**'
        exclude 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('verifyDescriptors', Exec) {
    commandLine 'python3', 'scripts/verify_descriptors.py'
}

tasks.named('check') {
    dependsOn 'verifyDescriptors'
}
